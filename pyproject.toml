[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` string used below. The build
# backend runs in an isolated environment, so this pin does not touch the pinned `Project`
# env described in docs/ENVIRONMENT.md.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydms"
version = "0.1.0"
description = "Inverse design of metal-hydride compositions: uncertainty-aware screening and multi-objective search over the composition simplex"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Amirhossein Nasiri" }]
keywords = ["hydrogen-storage", "metal-hydrides", "materials-informatics", "inverse-design"]

# 3.10.13 is the pinned, verified interpreter. 3.13 is excluded because it forces NumPy 2.x,
# which breaks CBFV and the removed NumPy 2.0 aliases the pipeline still relies on.
requires-python = ">=3.10,<3.13"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]

# Core runtime only. Every pin here is already satisfied inside the `Project` environment,
# so `pip install -e .` installs the package and nothing else. That is deliberate: pulling a
# new package into `Project` would invalidate environment.lock.yml and requirements-lock.txt,
# which exist to reproduce the published numbers. Dependencies that are decided but not yet
# used live in the optional groups below and are installed by the card that first needs them.
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "catboost>=1.2",
  "cleanlab>=2.7",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
# Conformal calibration of the surrogate's prediction intervals. The >=1.0 floor is not
# cosmetic: 0.x exposes MapieRegressor(...).predict(X, alpha=...), while 1.x replaced it with
# fit() / conformalize() / predict_interval(confidence_level=...). See docs/LIBRARY-APIS.md.
uq = ["mapie>=1.0"]

# NSGA-II on the composition simplex, plus the hypervolume and convergence diagnostics.
search = ["pymoo>=0.6"]

# Element Mover's Distance — turns "novel" into a measured number.
novelty = ["ElMD>=0.5"]

# Streamlit screening and Pareto-front pages.
app = ["streamlit>=1.30"]

# CBFV is the featuriser being *replaced*, kept only so the parity gate can diff against it.
# It is unlicensed (all rights reserved by default), which is precisely why the descriptor
# layer is being reimplemented — so it must never become a runtime dependency.
parity = ["CBFV==1.1.0"]

# The prediction service. Every pin here is already present in requirements-lock.txt as a
# leftover of the removed N8N service (docs/ENVIRONMENT.md calls that pollution), so this
# extra names versions the `Project` environment already satisfies rather than pulling
# anything new into it — and the lock file must not be regenerated to "tidy" that up.
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30",
  "pydantic>=2.7",
]

dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",      # the FastAPI TestClient transport
  "tomli>=2.0; python_version < '3.11'",   # tomllib is 3.11+; the pinned interpreter is 3.10
  "types-PyYAML>=6.0",                     # PyYAML is core; these are its stubs
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/AN-Hy-tech/hydride-storage-prediction"

[tool.setuptools.packages.find]
include = ["hydms*"]
exclude = ["Machine_Model*", "tests*", "scripts*"]

[tool.setuptools.package-data]
# Element-property tables ship inside the package: the descriptor layer must not depend on
# the repository layout to find the data it reimplements.
hydms = ["descriptors/data/*.csv", "config/*.yaml"]

# ---------------------------------------------------------------------------------------
# Test discovery
#
# `testpaths` and `norecursedirs` are not tidiness — they are a safety interlock.
# Machine_Model/tests/ holds two files that match pytest's default `test_*.py` pattern and
# are not tests: `test_catboost_smogn.py` calls optuna.create_study(...).optimize() at module
# scope, so collecting it *runs a hyperparameter study*; and `test_check_database.py` asserts
# against a gitignored SQLite file that is absent from a clean clone. Neither can be fixed in
# place — Machine_Model/ is the archival record behind REPORT.md and the Phase H freeze denies
# edits to it — so they are excluded here instead. Card #69.

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# NOTE: setting this key *replaces* pytest's defaults, it does not extend them. The first
# nine entries are those defaults, restored verbatim — dropping `.*` alone is enough to make
# `pytest .` start collecting the vendored skill suites under .claude/. Only the last two are
# this project's own additions.
norecursedirs = [
  "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
  "Machine_Model", "graphify-out",
]
addopts = "-q --strict-markers --strict-config --import-mode=importlib"
markers = [
  "slow: takes more than a few seconds; excluded from the CI fast lane",
  "leak: a leak sentinel — it passes only because a named leak is absent (gate HG-1)",
  "gate: an acceptance-criteria or hardening gate check",
]
filterwarnings = ["error::DeprecationWarning:hydms.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["hydms", "tests"]
extend-exclude = ["Machine_Model", "graphify-out"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import order
  "B",         # bugbear
  "UP",        # pyupgrade
  "SIM",       # simplify
  "RUF",       # ruff-specific
  "NPY",       # numpy legacy-API misuse, which is exactly what the 1.26 pin exists to avoid
  "PD",        # pandas antipatterns, including inplace= and chained assignment
]
ignore = [
  "E501",      # line length is formatted, not linted
  "PD901",     # `df` is the conventional name throughout this codebase
]

[tool.ruff.lint.per-file-ignores]
# Tests may shadow builtins in fixtures and assert on private helpers.
"tests/**" = ["B011", "PD011"]

[tool.mypy]
python_version = "3.10"
files = ["hydms"]
exclude = ["Machine_Model/", "build/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

# The scientific stack ships incomplete or absent stubs. Silencing the import errors keeps
# mypy useful on our own code rather than drowning it in third-party noise.
#
# NumPy is handled separately, below, because it is a different problem: it ships *real*
# stubs and they are what breaks.
[[tool.mypy.overrides]]
module = [
  "catboost.*", "cleanlab.*", "mapie.*", "pymoo.*", "ElMD.*", "CBFV.*",
  "sklearn.*", "scipy.*", "streamlit.*", "shap.*", "boruta.*",
  # pandas ships no inline types either; pandas-stubs is a separate distribution and the
  # conda-free lint lane installs nothing (card #68).
  "pandas",
  # PyYAML ships no inline types. types-PyYAML is in the dev extra and takes precedence
  # when installed; this keeps mypy runnable on a bare CI interpreter when it is not.
  "yaml",
  # joblib ships neither inline types nor a py.typed marker, and the conda-free lint lane
  # does not install it at all. It is the artifact store's persistence mechanism (card #4).
  "joblib",
]
ignore_missing_imports = true

# NumPy. This block is a deliberate trade made on card #16 and it costs something real, so
# the cost is written here rather than left to be rediscovered.
#
# The problem: mypy runs OUTSIDE the `Project` environment by design — the conda-free lint
# lane, card #68, docs/QA-PROTOCOL.md §6 — so it resolves numpy from the machine's Python
# 3.13 site-packages, whose `__init__.pyi` uses PEP 695 `type` statements. Under
# `python_version = "3.10"` those are a *syntax* error, which aborts the entire run rather
# than one file: `Found 1 error in 1 file (errors prevented further checking)`.
# `ignore_missing_imports` does not suppress a syntax error, because the import resolves.
# Cards #71 and #11 both sidestepped it — stdlib `random`, `math.log1p` — and the descriptor
# layer cannot: composition statistics over 55 elements are array code.
#
# `follow_imports = "skip"` makes mypy accept the import without parsing the stub at all.
#
# THE COST: numpy becomes `Any`. mypy no longer checks dtype or shape mistakes in the layer
# that has the most array code in the project — exactly where it would be most useful. That
# is the same trade already made above for pandas, scipy and scikit-learn, but it is a worse
# one, because those ship no usable types while numpy's are good. Two better answers exist
# and were both rejected as bigger than this card: vendoring numpy stubs pinned to the 1.26
# line (a new committed dependency, and it drifts), and a second mypy target run inside
# `Project` (which breaks the conda-free lane's promise to report when the environment is
# broken). If the lint lane ever moves onto a 3.10 interpreter with numpy 1.26 installed,
# this block should be deleted and the real stubs used.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true

# The delivery layer is the boundary users meet, so it is held to a stricter standard than
# the research code behind it: no implicit Any may cross the prediction contract.
[[tool.mypy.overrides]]
module = "hydms.delivery.*"
disallow_any_generics = true
warn_return_any = true

[tool.coverage.run]
source = ["hydms"]
branch = true
omit = ["*/__init__.py"]

[tool.coverage.report]
# The floor is a ratchet, not a target. It rises as layers land; card #86 is what turns it
# into a build failure in CI. Lowering it to make a build pass is a review conversation.
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
