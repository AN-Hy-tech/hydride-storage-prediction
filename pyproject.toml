[build-system]
# setuptools >= 77 is required for the PEP 639 SPDX `license` string used below. The build
# backend runs in an isolated environment, so this pin does not touch the pinned `Project`
# env described in docs/ENVIRONMENT.md.
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hydms"
version = "0.1.0"
description = "Inverse design of metal-hydride compositions: uncertainty-aware screening and multi-objective search over the composition simplex"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Amirhossein Nasiri" }]
keywords = ["hydrogen-storage", "metal-hydrides", "materials-informatics", "inverse-design"]

# 3.10.13 is the pinned, verified interpreter. 3.13 is excluded because it forces NumPy 2.x,
# which breaks CBFV and the removed NumPy 2.0 aliases the pipeline still relies on.
requires-python = ">=3.10,<3.13"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Programming Language :: Python :: 3.10",
  "Operating System :: OS Independent",
]

# Core runtime only. Every pin here is already satisfied inside the `Project` environment,
# so `pip install -e .` installs the package and nothing else. That is deliberate: pulling a
# new package into `Project` would invalidate environment.lock.yml and requirements-lock.txt,
# which exist to reproduce the published numbers. Dependencies that are decided but not yet
# used live in the optional groups below and are installed by the card that first needs them.
dependencies = [
  "numpy>=1.26,<2.0",
  "pandas>=2.0",
  "scipy>=1.11",
  "scikit-learn>=1.5",
  "catboost>=1.2",
  "cleanlab>=2.7",
  "PyYAML>=6.0",
  "joblib>=1.3",
]

[project.optional-dependencies]
# Conformal calibration of the surrogate's prediction intervals.
uq = ["mapie>=0.8"]

# NSGA-II on the composition simplex, plus the hypervolume and convergence diagnostics.
search = ["pymoo>=0.6"]

# Element Mover's Distance — turns "novel" into a measured number.
novelty = ["ElMD>=0.5"]

# Streamlit screening and Pareto-front pages.
app = ["streamlit>=1.30"]

# CBFV is the featuriser being *replaced*, kept only so the parity gate can diff against it.
# It is unlicensed (all rights reserved by default), which is precisely why the descriptor
# layer is being reimplemented — so it must never become a runtime dependency.
parity = ["CBFV==1.1.0"]

dev = ["pytest>=8.0", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Repository = "https://github.com/AN-Hy-tech/hydride-storage-prediction"

[tool.setuptools.packages.find]
include = ["hydms*"]
exclude = ["Machine_Model*", "tests*", "scripts*"]

[tool.setuptools.package-data]
# Element-property tables ship inside the package: the descriptor layer must not depend on
# the repository layout to find the data it reimplements.
hydms = ["descriptors/data/*.csv", "config/*.yaml"]
