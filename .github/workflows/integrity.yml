# Fast lane, seed version.
#
# This checks the artifacts that exist today — the board and the prose — and nothing else.
# It deliberately installs no dependencies and creates no conda environment, so it stays
# under a minute and keeps working while the project environment is still being pinned.
#
# The acceptance-criteria gates (AC-1 .. AC-8) are NOT here yet: they need the hydms
# package, the config loader and the gate harness first. When those land, the CI fast-lane
# card extends this workflow with lint, tests and `hydms.gates run --fast` rather than
# replacing it.

name: integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded push has nothing useful left to say; cancel it and keep the queue short.
concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  board-and-prose:
    name: Board and prose integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install` step: check_board.py is stdlib-only by design.
      - name: Check board and prose integrity
        run: python scripts/check_board.py --root .
