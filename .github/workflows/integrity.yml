# Fast lane, seed version.
#
# This checks the artifacts that exist today — the board and the prose — and nothing else.
# It deliberately installs no dependencies and creates no conda environment, so it stays
# under a minute and keeps working while the project environment is still being pinned.
#
# The acceptance-criteria gates are NOT here yet: they need the hydms package, the config
# loader and the gate harness first. When those land, card #86 extends this workflow with
# lint, tests and `hydms.gates run --fast` rather than replacing it.
#
# The freeze check joined it in Phase H. It reads the pull request's diff, so it needs full
# history — hence fetch-depth: 0. Together with check_board.py's frozen-board status rule,
# it is what makes docs/FREEZE.md enforced rather than remembered.

name: integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A superseded push has nothing useful left to say; cancel it and keep the queue short.
concurrency:
  group: integrity-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  board-and-prose:
    name: Board and prose integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # check_freeze.py diffs against the base ref; a shallow clone cannot resolve it.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No `pip install` step: both checks are stdlib-only by design.
      - name: Check board and prose integrity
        run: python scripts/check_board.py --root .

      - name: Check the Phase H implementation freeze
        run: python scripts/check_freeze.py --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"
